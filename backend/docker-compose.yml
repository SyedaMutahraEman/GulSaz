services:
  db:
    image: postgres:16-alpine
    container_name: clothing-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothing_pos
    ports:
      - "5432:5432"
    volumes:
      - clothing_pos_pgdata:/var/lib/postgresql/data

volumes:
  clothing_pos_pgdata:
